# Apps published in this F-Droid repository.
#
# Each entry pulls the signed APKs attached to the newest GitHub releases of
# `github`, plus the fastlane store text and screenshots at that release's tag.
# The APKs are published exactly as released: F-Droid clients verify the app's
# own signature, this repo only signs the index.
#
#   id:        the app's applicationId (must match the APKs)
#   github:    owner/repo whose releases carry the APKs
#   assets:    regex matched against release asset names
#   fastlane:  path of the fastlane metadata dir in the app repo (optional)
#   keep:      how many releases to keep available (default: keep_releases)

keep_releases: 2

apps:
  - id: org.buetow.quicklog
    github: snonux/quicklog
    assets: '^app-.*-release\.apk$'
    fastlane: fastlane/metadata/android

  - id: org.buetow.turbonotes
    github: snonux/turbonotes
    assets: '^app-.*-release\.apk$'
    fastlane: fastlane/metadata/android

  - id: org.snonux.comicredr
    github: snonux/comicredr
    assets: '^comicredr-.*\.apk$'
    fastlane: fastlane/metadata/android

  - id: org.buetow.restforge
    github: snonux/restforge
    assets: '^restforge-.*\.apk$'
    fastlane: flutter/fastlane/metadata/android

  - id: zone.foo.player_android
    github: snonux/player
    assets: '^player-v[0-9]+\.[0-9]+\.[0-9]+-(armeabi-v7a|arm64-v8a|x86_64)\.apk$'
    fastlane: player-android/fastlane/metadata/android

  - id: org.buetow.turbolaunch
    github: snonux/turbolaunch
    assets: '^app-.*-release\.apk$'
    fastlane: fastlane/metadata/android
